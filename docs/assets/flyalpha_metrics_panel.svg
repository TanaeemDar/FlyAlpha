<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320" role="img" aria-labelledby="title desc">
  <title id="title">FlyAlpha sample metrics panel</title>
  <desc id="desc">Sample visual metrics for public README presentation.</desc>
  <rect width="960" height="320" fill="#0b1117"/>
  <text x="48" y="48" fill="#f6f0de" font-family="Arial, sans-serif" font-size="26" font-weight="700">FlyAlpha Backtest Telemetry</text>
  <g font-family="Arial, sans-serif">
    <rect x="48" y="82" width="190" height="150" rx="8" fill="#13202a" stroke="#244252"/>
